<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Home Hub</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-shell">
    
    <!-- Header -->
    <header class="top-nav">
      <div class="brand">
        <div class="status-pulse"></div>
        <div>
          <h1>Smart Home Hub</h1>
          <span class="hub-mode" id="connection-status">กำลังเชื่อมต่อ LAN...</span>
        </div>
      </div>
      
      <div class="quick-status">
        <div class="badge">
          <i data-lucide="zap"></i>
          <span id="total-power-val">0 W</span>
        </div>
        <button id="voice-btn" class="icon-action-btn" title="สั่งงานด้วยเสียง">
          <i data-lucide="mic"></i>
        </button>
      </div>
    </header>

    <!-- Preset Scenes -->
    <section class="section-scenes">
      <button class="scene-chip active" data-scene="home"><i data-lucide="sun"></i> อยู่บ้าน</button>
      <button class="scene-chip" data-scene="away"><i data-lucide="shield"></i> ออกจากบ้าน</button>
      <button class="scene-chip" data-scene="night"><i data-lucide="moon"></i> เข้านอน</button>
    </section>

    <!-- Metrics Row -->
    <section class="metrics-row">
      <div class="glass-card stat-card">
        <div class="stat-header">
          <span>กำลังไฟฟ้าปัจจุบัน</span>
          <i data-lucide="activity" class="text-accent"></i>
        </div>
        <div class="stat-body">
          <h2 id="power-display">0 <small>Watts</small></h2>
          <p class="stat-sub" id="energy-cost-estimate">~0.00 บาท / วัน</p>
        </div>
        <canvas id="energySparkline" height="45"></canvas>
      </div>

      <div class="glass-card stat-card">
        <div class="stat-header">
          <span>กล้องและเซนเซอร์สด</span>
          <span id="nv-badge" class="badge-mini">Light Mode</span>
        </div>
        <div class="camera-preview-box">
          <video id="webcam" autoplay playsinline muted></video>
          <div id="motion-alert" class="motion-alert hidden">⚠ ตรวจพบความเคลื่อนไหว</div>
        </div>
        <div class="camera-controls">
          <button id="btn-toggle-cam" class="btn-sm"><i data-lucide="camera"></i> เปิดกล้องสด</button>
          <span id="lux-val" class="lux-label">ความสว่าง: -- lx</span>
        </div>
      </div>
    </section>

    <!-- Devices Grid -->
    <section class="devices-section">
      <div class="section-title">
        <h3>อุปกรณ์ภายในบ้าน</h3>
        <span class="device-count" id="device-count-label">0 เครื่อง</span>
      </div>
      <div class="device-cards-grid" id="devices-container"></div>
    </section>

    <!-- Voice Feedback Floating Bubble -->
    <div id="voice-toast" class="voice-toast hidden">
      <div class="voice-anim"></div>
      <span id="voice-text">กำลังฟังคำสั่ง...</span>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
