<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#090a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>บ้านของฉัน · Smart Home Hub</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-avatar">
        <i class="fa-solid fa-house-user"></i>
      </div>
      <div>
        <div class="brand-greeting">บ้านของฉัน</div>
        <div class="brand-sub">
          <span class="status-dot"></span>
          <span id="clockHeader">100% Local Isolated</span>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <span class="badge-pill">
        <i class="fa-solid fa-shield-cat"></i> Private Node
      </span>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="container">
    <div id="view"></div>
  </main>

  <!-- Floating Glass Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-v="home">
      <i class="fa-solid fa-house"></i>
      <span>หน้าแรก</span>
    </div>
    <div class="nav-item" data-v="cam">
      <i class="fa-solid fa-video"></i>
      <span>กล้อง</span>
    </div>
    <div class="nav-item" data-v="energy">
      <i class="fa-solid fa-bolt"></i>
      <span>พลังงาน</span>
    </div>
    <div class="nav-item" data-v="auto">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span>อัตโนมัติ</span>
    </div>
    <div class="nav-item" data-v="remote">
      <i class="fa-solid fa-gamepad"></i>
      <span>รีโมท IoT</span>
    </div>
    <div class="nav-item" data-v="log">
      <i class="fa-solid fa-list-check"></i>
      <span>บันทึก</span>
    </div>
  </nav>

  <!-- Toast Container -->
  <div id="toast"></div>

  <!-- Real Sensor Permission Modal -->
  <div id="perm">
    <div style="font-size: 56px; margin-bottom: 12px;">🏠</div>
    <h2 style="color: #fff; font-size: 20px; margin-bottom: 8px; text-transform: none;">
      ยินดีต้อนรับสู่ Smart Home Hub
    </h2>
    <p style="color: #94a3b8; font-size: 13.5px; line-height: 1.65; max-width: 320px;">
      ระบบประมวลผลสมาร์ทโฮมส่วนตัวแบบ 100% Local<br>
      <span style="color: #64748b; font-size: 12px;">รองรับการเชื่อมต่อเซนเซอร์จริงในมือถือ แสงสว่าง การเคลื่อนไหว และตำแหน่ง GPS</span>
    </p>
    <button id="go" style="background: linear-gradient(135deg, #6366f1, #38bdf8); color: white; border: 0; padding: 15px 40px; border-radius: 16px; font-size: 15px; font-weight: 700; margin-top: 24px; cursor: pointer; box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);">
      เริ่มต้นใช้งานระบบ
    </button>
    <button id="skip" style="background: none; color: #64748b; border: 0; font-size: 13px; margin-top: 16px; cursor: pointer;">
      ข้ามไปใช้โหมดจำลอง
    </button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
