<!DOCTYPE html>
<!-- v2.0-build-release -->
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#090a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>บ้านของฉัน · Smart Home Hub</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for(let r of regs) r.unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then(keys => {
        for(let k of keys) caches.delete(k);
      });
    }
  </script>
  <link rel="stylesheet" href="./styles.css?v=999">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-avatar">
        <i class="fa-solid fa-house-user"></i>
      </div>
      <div>
        <div class="brand-greeting">บ้านของฉัน</div>
        <div class="brand-sub">
          <span class="status-dot"></span>
          <span id="clockHeader">100% Local Isolated</span>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <span class="badge-pill">
        <i class="fa-solid fa-shield-cat"></i> Private Node
      </span>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="container">
    <div id="view"></div>
  </main>

  <!-- Floating Glass Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active" data-v="home">
      <i class="fa-solid fa-house"></i>
      <span>หน้าแรก</span>
    </div>
    <div class="nav-item" data-v="cam">
      <i class="fa-solid fa-video"></i>
      <span>กล้อง</span>
    </div>
    <div class="nav-item" data-v="energy">
      <i class="fa-solid fa-bolt"></i>
      <span>พลังงาน</span>
    </div>
    <div class="nav-item" data-v="auto">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span>อัตโนมัติ</span>
    </div>
    <div class="nav-item" data-v="remote">
      <i class="fa-solid fa-gamepad"></i>
      <span>รีโมท IoT</span>
    </div>
    <div class="nav-item" data-v="log">
      <i class="fa-solid fa-list-check"></i>
      <span>บันทึก</span>
    </div>
  </nav>

  <!-- Toast Container -->
  <div id="toast"></div>

  <script src="./app.js?v=1000"></script>
</body>
</html>
